<!DOCTYPE html>
<html>
  <head>6
    <title>Registrarse</title>
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!--Import materialize.css-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  
  <body>
    <div class="container">
      <div class="row">
        <form class="col s12 m6 offset-m3">
          <div class="card">
            <div class="card-content">
              <div class="card-title">
                <span>FORMULARIO DE REGISTRO</span>
              </div>
              <div class="row">
                <div class="input-field">
                  <input [(ngModel)]="CuentaNueva.NombreCompleto" id="first_name" name="Nombre" type="text"
                    class="validate">
                  <label for="first_name">Ingrese su nombre</label>
                </div>
              </div>
  
              <div class="row">
                <div class="input-field">
                  <input [(ngModel)]="CuentaNueva.CorreoElectronico" id="email" name="correo" type="email"
                    class="validate">
                  <label for="email">Ingrese su correo electrónico</label>
                </div>
              </div>
  
              <div class="row">
                <div class="input-field">
                  <input [(ngModel)]="CuentaNueva.Contrasena" [type]="mostrarContrasena ? 'text' : 'password'" name="Contrasena" id="passwordInput">
                  <label for="passwordInput">Ingrese la contraseña</label>
                  <i class="material-icons password-toggle" (click)="togglePasswordVisibility()">
                    {{ mostrarContrasena ? 'visibility' : 'visibility_off' }}
                  </i>
                </div>
              </div>
  
              <div class="row">
                <div class="input-field">
                  <input [(ngModel)]="Confirmando_Contrasena" [type]="mostrarContrasenaconfirmacion ? 'text' : 'password'" name="Contrasenaconfirmacion" id="passwordInputConfirmacion">
                  <label for="passwordInput">Confirme su contraseña</label>
                  <i class="material-icons password-toggle" (click)="togglePasswordVisibilityConfirmacion()">
                    {{ mostrarContrasenaconfirmacion ? 'visibility' : 'visibility_off' }}
                  </i>
                </div>
              </div>
  
              <div class="row">
                <div class="input-field">
                  <input [(ngModel)]="CuentaNueva.NumeroTelefono" id="numero_telefono" name="Nombre" type="text"
                    class="validate">
                  <label for="numero_telefono">Ingrese su número telefónico</label>
                </div>
              </div>
  
              <div class="row">
                <div class="col s12">
                  <button (click)="registrarse()" class="btn waves-effect waves-light enviar" type="submit"
                    name="action">Registrarse
                    <i class="material-icons right">send</i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  
    <!--JavaScript at end of body for optimized loading-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  </body>
  
  </html>
