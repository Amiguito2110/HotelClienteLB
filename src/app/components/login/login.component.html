<!DOCTYPE html>
<html>

<head>
  <title>Inicio de sesión</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col s12 m6 offset-m3">
        <div class="card">
          <div class="card-content">
            <img class="card-img-top" src="../../../assets/images/logo_transparente.png" width="320" height="150">
            <div class="card-title">
              <span>INICIO DE SESION</span>
            </div>
            <form>
              <div class="row">
                <div class="input-field">
                  <input [(ngModel)]="cuenta.CorreoElectronico" type="email" name="CorreoElectronico"><label
                    for="">Ingrese el correo electrónico</label>
                </div>
              </div>

              <div class="row">
                <div class="input-field">
                  <input [(ngModel)]="cuenta.Contrasena" [type]="mostrarContrasena ? 'text' : 'password'" name="Contrasena" id="passwordInput">
                  <label for="passwordInput">Ingrese la contraseña</label>
                  <i class="material-icons password-toggle" (click)="togglePasswordVisibility()">
                    {{ mostrarContrasena ? 'visibility' : 'visibility_off' }}
                  </i>
                </div>
              </div>

              <div class="row">
                <div class="col s7 ">
                  <a class="btn waves-effect waves-light mover-izquierda" href="/registro">Registrarse<i
                      class="material-icons right">add</i></a>
                </div>
                <div class="col s5">
                  <button (click)="login()" class="btn waves-effect waves-light" type="submit" name="action">Ingresar<i
                      class="material-icons">login</i></button>
                </div>
              </div>
              <div class="row">
                <div class="col s12 recuperar">
                  <a (click)="ir_a_recuperar()">
                    Recuperar contraseña</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>

</html>
