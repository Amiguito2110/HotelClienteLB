 <!DOCTYPE html>
<html>

<head>
  <title>INICIAR SESIÓN</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <style>
    body {
      background-color: blanchedalmond;
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
    }

    .container {
      margin: auto;
    }

    .card {
      margin: auto;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col s12 m6 offset-m3">
        <div class="card">
          <div class="card-content">
            <img class="card-img-top" 
              src="../../../assets/images/logo_transparente.png" 
              width="320" height="150">
            <span class="card-title">Recuperar Contraseña</span>
            <form>

              <div class="row">
                <div class="input-field">
                  <div class="input-field">
                    <input [(ngModel)]="nuevacontrasena" type="password" 
                      name="Contrasena"><label
                      for="">Nueva Contraseña:</label>
                  </div>
                  <div class="input-field">
                    <input [(ngModel)]="confirmacion" type="password" 
                      name="Contrasena"><label
                      for="">Confirmar Contraseña:</label>
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col s12">
                  <button (click)="restableceContrasena(nuevacontrasena,confirmacion)" 
                    class="btn waves-effect waves-light" 
                    type="submit" name="action">Confirmar
                    <i class="material-icons right">login</i>
                  </button>
                </div>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  
</body>

</html>
